[package]
name = "export_geotiff_wasm"
version = "0.1.0"
edition = "2021"
description = "WASM wrapper: converts raw GPU coverage output to GeoTIFF in memory."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1"
