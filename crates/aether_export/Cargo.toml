[package]
name = "aether_export"
version = "1.0.0"
edition = "2021"
license.workspace = true
description = "Pure-Rust bitmask-to-GeoTIFF exporter for the AETHER engine. No GDAL."

[[bin]]
name = "aether_export"
path = "src/main.rs"

[dependencies]
memmap2 = "0.9"
rayon = "1.10"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1