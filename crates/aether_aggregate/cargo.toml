[package]
name = "aether_aggregate"
version = "1.0.0"
edition = "2021"
description = "Aggregate multiple raster files into max/count COG outputs (pure Rust, no GDAL)"

[[bin]]
name = "aether_aggregate"
path = "src/main.rs"

[dependencies]
memmap2 = "0.9"
rayon = "1.10"
flate2 = { version = "1", features = ["rust_backend"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1