[package]
name = "aether_converter"
version = "0.2.4"
edition = "2021"

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive"] }
# JSON Handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Image IO
byteorder = "1.5"
tiff = "0.9"
image_dds = { version = "0.3", optional = true }
bytemuck = "1.14"
# Parallel Processing
rayon = "1.8"
# Error Handling
anyhow = "1.0"
# GIS
flatgeobuf = { version = "4.0", default-features = false }
fallible-streaming-iterator = "0.1"
# Logging
log = "0.4"
env_logger = "0.11"
# System
sysinfo = "0.30"
# HTTP (async tile download)
reqwest = { version = "0.12", features = ["rustls-tls", "http2"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
futures = "0.3"
# PNG decoding (for terrain tile decode)
png = "0.17"

[dev-dependencies]
tempfile = "3"

[features]
bc6h = ["image_dds"]