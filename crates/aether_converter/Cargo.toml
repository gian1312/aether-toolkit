[package]
name = "aether_converter"
version = "0.2.0"
edition = "2021"

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive"] }
# JSON Handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Image IO
byteorder = "1.5"
tiff = "0.9"
# Parallel Processing
rayon = "1.8"
# Error Handling
anyhow = "1.0"
# GIS / Geometry
flatgeobuf = "3.0"
geozero = "0.10"