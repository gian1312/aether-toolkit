[package]
name = "aether_converter"
version = "0.2.10"
edition = "2021"
license.workspace = true

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive"] }
# JSON Handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Image IO
byteorder = "1.5"
# 0.11, not 0.9: 0.9 refuses TIFF predictor 2 (horizontal differencing) on
# floating-point samples outright ("Horizontal predictor for Gray(32) is
# unsupported"), which is how swissALTIRegio and plenty of other Float32
# DEMs are compressed. 0.11 allows (Horizontal, IEEEFP) and un-differences
# at any bit depth. Same API surface for everything this crate calls.
# `webp` is pure Rust and builds everywhere. `zstd` (TIFF compression 50000,
# GDAL's COMPRESS=ZSTD) links the C libzstd through zstd-sys, which needs a C
# toolchain for the target — so it is enabled for native builds only (below);
# the wasm build keeps refusing ZSTD with the named "unsupported compression"
# error. LERC (34887) and JPEG-XL (50002) have no decoder in `tiff` at all.
tiff = { version = "0.11", features = ["webp"] }
image_dds = { version = "0.3", optional = true }
bytemuck = "1.14"
# Parallel Processing
rayon = { version = "1.8", optional = true }
# Error Handling
anyhow = "1.0"
# GIS
flatgeobuf = { version = "4.0", default-features = false }
fallible-streaming-iterator = "0.1"
# Logging
log = "0.4"
env_logger = "0.11"
# System
sysinfo = { version = "0.30", optional = true }
# HTTP (async tile download)
reqwest = { version = "0.12", features = ["rustls-tls", "http2"], default-features = false }
tokio = { version = "1", features = ["macros", "sync", "time"] }
futures = "0.3"
# Terrain tile decoding: PNG (AWS Terrarium, MapTiler v1) and WebP (Mapterhorn,
# MapTiler v2). `image-webp` is pure Rust and already in the tree via `tiff`.
png = "0.17"
image-webp = "0.2"
# MVT/PBF vector tile decoding (for building data from OpenFreeMap)
prost = "0.13"
# Gzip decompression (for PBF tiles that may be internally gzipped)
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# LZW for the direct GeoTIFF chunk decoder (src/tiff_io.rs): the same weezl
# the `tiff` crate decodes with (already in the tree through it), configured
# exactly as tiff 0.11.3 configures it.
weezl = "0.1.12"
proj4rs = "0.1.10"
crs-definitions = "0.5.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiff = { version = "0.11", features = ["webp", "zstd"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# The `[Rust] run:` diagnostic line (CPU time, page faults): getrusage on
# Unix, GetProcessTimes / GetProcessMemoryInfo on Windows. Both crates are
# already in the tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
# Global allocator of the native Windows binary only (src/main.rs, CONTRACT
# changelog 37): the Windows heap hands large blocks back to the OS on free,
# so every tile buffer and window came back as fresh, faulting pages (34 565
# faults per 2 m tile measured there, 1.8x Linux; sys 15 % of CPU). MIT. Not
# built for Linux/macOS (their allocators were measured fine) nor for the
# wasm crate (`native` is off there).
mimalloc = { version = "0.1", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"

# Tests only: zstd writes the ZSTD-compressed fixture the decoder must read
# (already in the tree through tiff's `zstd` feature); libc reads a child
# process's peak RSS for the streaming-memory test.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
zstd = "0.13"
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[features]
default = ["native"]
native = ["tokio/rt-multi-thread", "dep:sysinfo", "dep:rayon", "dep:mimalloc"]
bc6h = ["image_dds"]
