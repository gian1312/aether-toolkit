[package]
name = "aether_converter"
version = "0.2.3"
edition = "2021"

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive"] }
# JSON Handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Image IO
byteorder = "1.5"
tiff = "0.9"
image_dds = "0.3"
bytemuck = "1.14"
# Parallel Processing
rayon = "1.8"
# Error Handling
anyhow = "1.0"
# GIS
flatgeobuf = "4.0"
fallible-streaming-iterator = "0.1"
# Logging
log = "0.4"
env_logger = "0.11"