[package]
name = "aether_converter"
version = "0.2.4"
edition = "2021"
license.workspace = true

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive"] }
# JSON Handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Image IO
byteorder = "1.5"
tiff = "0.9"
image_dds = { version = "0.3", optional = true }
bytemuck = "1.14"
# Parallel Processing
rayon = { version = "1.8", optional = true }
# Error Handling
anyhow = "1.0"
# GIS
flatgeobuf = { version = "4.0", default-features = false }
fallible-streaming-iterator = "0.1"
# Logging
log = "0.4"
env_logger = "0.11"
# System
sysinfo = { version = "0.30", optional = true }
# HTTP (async tile download)
reqwest = { version = "0.12", features = ["rustls-tls", "http2"], default-features = false }
tokio = { version = "1", features = ["macros", "sync", "time"] }
futures = "0.3"
# PNG decoding (for terrain tile decode)
png = "0.17"
# MVT/PBF vector tile decoding (for building data from OpenFreeMap)
prost = "0.13"
# Gzip decompression (for PBF tiles that may be internally gzipped)
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
proj4rs = "0.1.10"
crs-definitions = "0.5.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
tempfile = "3"

[features]
default = ["native"]
native = ["tokio/rt-multi-thread", "dep:sysinfo", "dep:rayon"]
bc6h = ["image_dds"]
